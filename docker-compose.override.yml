# Local override: RemitM shares host ports with the Layla stack (it is a rebranded
# copy). Remap RemitM to free ports so both stacks can run side by side.
# Layla keeps 3310/6382/8095/8096; RemitM uses 3311/6383/8097/8098.
services:
  mysql:
    ports: !override
      - "3311:3306"
  redis:
    ports: !override
      - "6383:6379"
  backend:
    ports: !override
      - "8097:8080"
    # The local frontend is served on :8098 (remapped below). The backend's CORS allow-list
    # includes app.frontend-url, so pointing FRONTEND_URL at :8098 lets the browser at :8098
    # call the API. Without this, preflight returns 403 and the UI shows a misleading
    # "invalid email or password" on login (the response is CORS-blocked, not rejected).
    environment:
      - FRONTEND_URL=http://localhost:8098
      # Option B (manual dispatch): funds-received routes to the "To Dispatch" queue but does NOT
      # auto-send to Nsano — a human clicks Dispatch. Matches prod (.env.production).
      - PAYOUT_AUTO_DISBURSE_ENABLED=false
  frontend:
    ports: !override
      - "8098:80"
